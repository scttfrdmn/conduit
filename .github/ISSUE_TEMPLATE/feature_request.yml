name: Feature Request
description: Suggest a new feature for Conduit
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature!

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem would this feature solve?
      placeholder: I'm frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
      placeholder: I would like...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe alternatives you've considered

  - type: dropdown
    id: domain
    attributes:
      label: Scientific Domain
      description: Which domain is this feature for?
      options:
        - All domains
        - Protein Science
        - Materials Science
        - Drug Discovery
        - Climate Science
        - Other
    validations:
      required: true

  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      description: What would this feature impact?
      options:
        - label: CLI tool
        - label: Model publishing
        - label: Deployment
        - label: Web UI
        - label: Documentation
        - label: API

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or examples
